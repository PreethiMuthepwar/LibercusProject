story 1:
  #  5 col story:
  Shape: "*5 col Story (5) with 2 col side photo NEW FONTS"
  Kicker: Car wash chief used CPR
  Title: Maumee honors life-saving aid
  subhead: Car wash chief used CPR to help save unconscious co-worker
  Byline: BY ERIC TAUNTON BLADE STAFF WRITER
  story: |
    He wasn’t even supposed to be there. Jason Eichenberg, president of Expresso Car Wash, who wasn’t supposed to be in the office on a Wednesday in December, was in a business meeting at one of the car wash’s locations in Maumee when he was suddenly thrust into a life-or-death situation.
    
    During the meeting, Mr. Eichenberg was told Tim Brown, a manager of 20 years for Expresso Car Wash, was found lying on the ground unresponsive as cars were passing through the garage. The president immediately performed CPR on Mr. Brown until firefighters and paramedics arrived. The CPR is credited for helping save Mr. Brown’s life.
    
    “It happened so fast,” Mr. Eichenberg said.
    
    Mr. Eichenberg was honored by the Maumee Fire Department on Tuesday.
    
    “The reason his co-worker Tim is alive today is because of the early actions of the staff at Expresso Car Wash and Jason performing CPR,” said Brandon Loboschefski, chief of the Maumee Fire Department. “Not only did they call 911 early, CPR was initiated immediately, and that gave Tim a fighting chance at life.”
    
    Mr. Brown, who’s been on medical leave since the incident, said he doesn’t remember anything about the incident.
    
    “It’s crazy,” Mr. Brown said. “I was told I had seizures at the hospital.”
    
    Manager Michael Porvaznik said he was working on Dec. 11 when a customer approached him, telling him they found Mr. Brown unconscious on the ground.
    
    After he told the customer to call 911, Mr. Porvaznik told Hannah Ladowitz, detail shop manager for the car wash, who alerted Mr. Eichenberg of the situation, Mr. Porvaznik said.
    
    “It was just weird,” Mr. Porvaznik said. “I was just down there 5 minutes prior to that, talking to him and helping him out, drying cars off.”
    
    When Ms. Ladowitz went to Mr. Brown and checked for a pulse, she said she knew he needed CPR, but she didn’t think she was strong enough to conduct it in an effective way.
    
    “I ran back upstairs,” Ms. Ladowitz recalled. “At that point, Jay was like, ‘Is everything OK?’ I was like, ‘No, Tim’s unresponsive.’ Within seconds, he started doing compressions. I don’t know who was on the phone but someone was talking him through it. ... He did compressions for probably 2 minutes or so, and then EMS got there and took over.”
