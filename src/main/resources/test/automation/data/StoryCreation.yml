            ■ Cornerback D’Angelo Ponds has two interceptions this season.
            ■ Wide receiver Elijah Sarratt ranks fourth in the Big Ten with 649 receiving yards.
            ■ Running back Ty Son Lawton ranks fourth in the Big Ten with nine rushing scores.
            ■ Linebacker Aiden Fisher ranks third in the Big Ten with 84 tackles.
            ■ Defensive lineman Mikail Kamara leads the Big Ten with 9.5 sacks.
            Zach Horton ranks third among Big Ten tight ends with three touchdowns.
