    Byline: ASSOCIATED PRESS
    story: "COLUMBUS — Ohio State football’s schedule was, seemingly, perfectly designed.
            After a tough stretch of three games — at Oregon, vs. Nebraska and at Penn State — Ohio State had an ideal setup leading into a must-win rivalry game against Michigan.
            Nov. 9 vs. Purdue: The Boilermakers were picked to finish last in the conference, according to the annual cleveland.com Preseason Big Ten Football Poll.
            COLUMBUS — Ohio State football’s schedule was, seemingly, perfectly designed.
            After a tough stretch of three games — at Oregon, vs. Nebraska and at Penn State — Ohio State had an ideal setup leading into a must-win rivalry game against Michigan.
            ★ Nov. 9 vs. Purdue: The Boilermakers were picked to finish last in the conference, according to the annual cleveland.com Preseason Big Ten Football Poll.
            ★ Nov. 16 at Northwestern (Wrigley Field): The Wildcats were picked to finish 15th.
            ★ Nov. 23 vs. Indiana: The Hoosiers were picked to finish 17th.
            ★ Ohio State appeared to have an easy path to three wins before facing Michigan — giving the Buckeyes a chance to even rest starters before the premier matchup. The Wolverines, who have won the last three meetings in the rivalry, would be the lone obstacle in the Buckeyes’ way toward a Big Ten championship game appearance.
            The Buckeyes have to face the Hoosiers — a likely undefeated top-10 team with its own dreams of making it to Lucas Oil Stadium.
            How has Indiana, which faces Michigan this week, turned things around?
            IU fired former coach Tom Allen, now the defensive coordinator at Penn State, and replaced him with Curt Cignetti. The former James Madison coach quickly overhauled the Hoosiers’ roster. Many of his top players from JMU followed Cignetti, and they’ve proven capable of playing in the Big Ten. Here are the notable transfers who went from James Madison to IU:
            Defensive lineman Mikail Kamara leads the Big Ten with 9.5 sacks.
            ❂ Zach Horton ranks third among Big Ten tight ends with three touchdowns.
            ❂ But the most important portal addition for Cignetti came from Ohio University. Quarterback Kurtis Rourke has thrown for 2,204 yards and 19 touchdowns. He has the sixth-best Heisman odds (+2200), according to DraftKings.
            ❂ Indiana’s rise to prominence has been aided by its path. The Hoosiers’ strength of schedule ranks 103rd in the country, according to ESPN’s College Football Power Index.
            ❂ However, IU has handled its slate. Indiana’s average margin of victory is 27.8 points — best in the nation.
            ❂ Who is Indiana coach Curt Cignetti?
            ❂ Cignetti is a native of Pittsburgh whose father, Frank Cignetti, was a former head coach at West Virginia.
            Cignetti’s career started as a graduate assistant at Pittsburgh in 1983. After various stops as an assistant, he landed at Alabama (2007-10) where he worked as a recruiting coordinator and receivers coach under Nick Saban.
            Cignetti got his first job as a head coach in 2011 with Indiana University of Pennsylvania. He spent six seasons with the Crimson Hawks before two years at Elon and five years at JMU.
            ● Cignetti is 128–35 as a head coach.
            ● What has Curt Cignetti said about Ohio State?
            ● Cignetti wasted little time energizing Indiana fans while also taking a shot at a trio of Big Ten rivals.
            ● On his first day, Cignetti was introduced to the IU crowd at a home basketball game. He quickly went viral for the message he shared.
            ● Hey, look, I’m super fired up about this opportunity,” Cignetti said. “I’ve never taken a back seat to anybody and don’t plan on starting now. Purdue sucks. But so does Michigan and Ohio State.”
            Whether done intentionally or not, Cignetti called out the last three opponents on Indiana’s schedule.
            Few would have predicted that IU’s penultimate game, a trip to Ohio State, could determine a spot in the Big Ten title game.
            Nov. 16 at Northwestern (Wrigley Field): The Wildcats were picked to finish 15th.
            Nov. 23 vs. Indiana: The Hoosiers were picked to finish 17th.
            Ohio State appeared to have an easy path to three wins before facing Michigan — giving the Buckeyes a chance to even rest starters before the premier matchup. The Wolverines, who have won the last three meetings in the rivalry, would be the lone obstacle in the Buckeyes’ way toward a Big Ten championship game appearance.
            ° Things have changed.
            ° The rivalry game doesn’t feel like a threat.
            ° Ohio State is going to be favored by multiple scores against the struggling school up north.
            ° It’s the lead-up to the game that could be tricky. Before facing the Wolverines.
            The Buckeyes have to face the Hoosiers — a likely undefeated top-10 team with its own dreams of making it to Lucas Oil Stadium.
