  Title: Hamas accelerates release of hostages
  subhead: 6 Israelis and 4 sets of remains to be returned
  Byline: ASSOCIATED PRESS
  story: " CAIRO — A top Hamas official says the militant group will free six living Israeli hostages Saturday and return the bodies of four others Thursday, a surprise acceleration in releases that apparently comes in return for Israel’s allowing mobile homes and construction equipment into the devastated Gaza Strip.
             
             The six are the last living hostages set to be freed during the cease-fire’s first phase in exchange for hundreds of Palestinians held in Israeli prisons. The warring sides have yet to negotiate the second and more difficult phase, in which Hamas would release dozens more hostages in exchange for a lasting cease-fire and an Israeli withdrawal.
             
             Hamas leader Khalil al-Hayya, in prerecorded remarks released Tuesday, said the “Bibas family” would be included in the handover of four bodies, apparently referring to Shiri Bibas and her two young sons, Ariel and Kfir, who for many Israelis embody the captives’ plight.
             
             Israel has not confirmed their deaths, and the prime minister’s office urged the public not to distribute “photos, names, and rumors” after the announcement by Hamas.
             
             “In the past few hours, we have been in turmoil,” surviving members of the Bibas family said in a statement released Tuesday by a group representing the relatives of hostages. “Until we receive definitive confirmation, our journey is not over.”
             
             Israel has said it was gravely concerned about the Bibas family, while Hamas said they were killed in an Israeli airstrike early in the war. Yarden Bibas, the husband and father, was kidnapped separately and released this month.
             
             Kfir, who was 9 months old at the time, was the youngest hostage taken in Hamas’ Oct. 7, 2023, attack that triggered the war. A video of the abduction showed Shiri swaddling her redheaded boys in a blanket and being whisked away by armed men.
             
             The six living hostages slated for release are Eliya Cohen, Tal Shoham, Omer Shem Tov, Omer Wenkert, Hisham Al-Sayed, and Avera Mengistu, the Hostages and Missing Families Forum said Tuesday.
             
             Mr. Cohen, 27, Mr. Shem Tov, 22, and Mr. Wenkert, 23, were abducted from a music festival. Mr. Shoham was taken from the hard-hit community of Kibbutz Beeri. Mr. Al-Sayed, 36, and Mr. Mengistu, 39, have been held since crossing into Gaza years before the Oct. 7 attack.
             
             The release of all six this week would mark an acceleration of the cease-fire deal, which called for Hamas to release three living hostages Saturday, with three more to be freed a week later. When the deal was made, it called only for the bodies of the dead to be returned by the end of the first phase.
             
             Israel is expected to continue releasing hundreds of Palestinian prisoners, including many serving life sentences for deadly attacks, in exchange for the hostages. Others were detained without charge. During the first phase, Israel is also due to release all women and children seized from Gaza since the war began.
             
             An Israeli official, speaking on condition of anonymity in line with regulations, said Prime Minister Benjamin Netanyahu had agreed to allow long-requested mobile homes and construction equipment into Gaza as part of efforts to accelerate the hostages’ release.
             
             Hamas last week threatened to hold up releases, citing the refusal to allow in mobile homes and heavy equipment among other alleged violations of the truce.
             
             Israel began allowing entry of rubble-removing equipment Tuesday, according to a journalist in southern Gaza and Egypt’s state-run media. The journalist saw two bulldozers clearing rubble in an area near the Palestinian side of the Rafah border crossing. An Egyptian driver said that dozens of bulldozers and tractors were at another crossing, awaiting Israeli permission to enter.
             
             Rebuilding Gaza could cost $53.2 billion, according to a report released Tuesday by the World Bank, the United Nations, and the European Union. The report identified almost $30 billion in damage from the war, nearly half reflecting destruction of homes.
             
             The cease-fire that began in mid-January has paused the deadliest fighting ever between Israel and Hamas, surged aid into devastated Gaza, and allowed hundreds of thousands of Palestinians to return to their homes as Israeli forces withdrew from much of the territory.
             
             Major challenges are ahead. Israel’s government says it wants to eliminate Hamas’ military and governing capabilities in Gaza. But the militant group quickly reasserted its control of the territory during the cease-fire despite losing leaders and many fighters.
             
             In addition, President Trump’s proposal to permanently remove Gaza’s population of some 2 million Palestinians so the United States can redevelop the territory has been rejected by the Arab world and by the Palestinians, who say they want to stay in their homeland.
             
             Egypt is working on a counterplan to rebuild without moving Palestinians.
             
             “We will not leave our country, no matter what happens,” Muhammad Shaaban, a resident of Jabaliya in northern Gaza, said. The area was hit by some of the fiercest bombardment of the war, and most of its buildings and infrastructure was destroyed or damaged.
             
             Mohammad Bahjat, also from Jabaliya, said Trump’s proposal is “unacceptable” and that he and his family would resist being expelled.
             
             Israel has embraced the plan, and they and the Trump Administration have emphasized they share the same goals in the war."
