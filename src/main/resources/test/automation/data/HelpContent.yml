Page Mode :
  How do I navigate to different pages?: "Use the left and right arrows present on either side of the page to switch between different pages of the edition you are currently viewing."
  How do I navigate to different sections?: "Use the left and right double arrows present on either side of the page to switch between sections of the edition you are currently viewing."
  What do the arrows on the side of pages mean?: "The arrows on the sides of the page are meant to switch between pages of an edition and the double arrows switch between sections of the edition you are currently viewing."
  How do I zoom in on the page?: "Click the Zoom icon in the upper right hand corner of the page to view Zoom tools. Use the tools Zoom in/Zoom out/ to Zoom in and out of the page."

Main Menu:
  What does the Home button do?: "It navigates you to the first page of the edition in which you are currently viewing."
  How do I navigate the Table of Contents?: "Use the TOC button to enable the Table of Content window. From this menu, you will see a list of sections in the edition you are currently viewing. Click on a section, and you will see a list of pages available in that section. Click on a page, and you will see a list of stories available for that page. Click on a story, and you will be taken to a view of that story to read it."
  What does the pages menu do?: "It enables you to download individual pages, sections or entire an edition to your PC, Mac, mobile device or tablet, allowing you to read editions/pages when you are without an internet connection."
  What does the editions menu do?: "It enables you to navigate to previous editions. You can also download an entire edition from this menu."
  What does the ads menu do?: "It enables you to navigate to the Print Ads and Insert Ads."
  How do I print the entire edition?: "Use the Print Edition button in menu bar to download a PDF of the edition you are viewing."
  How does search work?: "Use the Search button in the main menu to enable the Search window. Enter a word or text in the search box. The default search is for today's edition. Check the Previous Editions box to search for content in past editions and click on the search button. News search results will be displayed beneath the search criteria. You can search for ads in today's or previous editions. Only content from the past 30 days are available. If you want to search for content more than 30 days old, select the Advanced Search button and you will be redirected to The Blade's website."
  What is the settings menu?: "Use the Settings button in the main menu to enable the settings window. It has display options, menu layout styles and screen mode settings which you can select by opting it in the settings page. These settings will be saved for your future visits to this site."

Pages Menu:
  How do I download pages as PDF files?: "Click on the pages tool in the main menu, and select the pages you'd like to download by checking the checkbox and clicking the \"Download Select Selection\" button. Then the page(s) you selected will be downloaded as a PDF file."
  How do I print or share pages?: "Click on the pages tool in the main menu, and find the page you'd like to print or share. Click on the three dots in the bottom right corner below the page you are interested in printing or sharing. A pop up will appear allowing you to download a PDF, email, print or share the page."

Editions Menu:
  How do I view previous editions?: "Click on the edition tool in the main menu, and select the edition that you desire to read from the thumbnail preview. Click on the preview thumbnail, and you will be taken to that edition."
  How do I download an edition?: "Click on the 'Print Edition' button in the main menu. You will get an alert that says it requires Adobe Acrobat Reader. Click 'Ok' and the edition you are currently viewing will be downloaded."

Ads Menu:
  How do I print ads and other content?: "Click on the Ads button in main menu bar. A drop down menu will appear with an option for 'Print Ads'. Click on the 'Print Ads' option, and you will be redirected to Ads window. Select the required date from the select by date picker. Enter a word or text in the search text box and click Search Ads or View all ads in Edition button, then the ads search results will be displayed to the left side of the search criteria. Select required ad thumbnail in the search results and click print button in it. This will open a dialogue box where you can select the left or right page, paper size and margins. Once you have made your selections, just click the print button to open the standard print dialogue box for your system. Then select your printer preferences and click on print to send the page to the printer."

Search Menu:
  How do I search for content?: "Use the Search button in the main menu to enable the Search window. Enter a word or text in the search box. The default search is for today's edition. Check the Previous Editions box to search for content in past editions and click on the search button. News search results will be displayed beneath the search criteria. Only content from the past 30 days are available. Once the search results load, click an article title to open it for reading."
  How do I search for older content?: "Use the Search button in the main menu to enable the Search window. Enter a word or text in the search box. Check the Previous Editions box to search for content in past editions and click on the search button. News search results will be displayed beneath the search criteria. Only content from the past 30 days are available. If you want to search for content more than 30 days old, select the Advanced Search button and you will be redirected to The Blade's website, there the website provides a search function which will aid you in your quest."

Article View:
  How do I change the text size of a story I'm reading?: "In the article menu you will find icons to decrease or increase the text size of body text of the article you are currently reading."
  How do I listen to an article?: "To listen to an article on your computer you are reading, just click on the speaker icon in article menu to activate Interactive Radio which automatically starts reading the current article to you."
  How do I read another story from this view?: "In the article menu you will find arrows buttons to navigate to other stories. To move to a new article click on the right arrow in the article menu. When you select a next article, the current article is updated with the selected article. Likewise to move to previous article, click on the left arrow in the article menu then you will be navigated to the previous article."
  How do I print or download an article?: "To print an article you are reading, click on the print button in the article menu. This will open a dialogue box where you can select the left or right page, paper size and margins. Once you have made your selections, just click the print button to open the standard print dialogue box for your system. Then select your printer preferences and click on print to send the page to the printer. If you want to download the article as a PDF, select the save as PDF option from your printer dialogue box."
  How do I e-mail a story to someone?: "To e-mail a story, click on the e-mail button in the article menu. Fill in the necessary fields, including who you would like to send the story to. Then click on the \"Send\" button, and your email will be sent."

Settings Menu:
  How can I view pages side by side (double-page mode)?: "Use the Settings button in the main menu to enable the Settings window. Select the Double Page option in it to view your pages side by side."
  What are the default settings?: "Use the Settings button in the main menu to enable the Settings window. You can see default settings in it. Single page display and top menu layout style are the default settings."
  How can I change the default settings?: "Use the Settings button in the main menu to enable the Settings window where in, you can change the default settings."

General Questions:
  How do I change my password?: "Click on the three dots in the main menu bar. A drop down menu will appear with an option for 'My Account.' Click on the 'My Account' option, and you will be redirected to your account page. Click on the 'Profile' tab and select 'Change Password.' Enter your current password, followed by your new password. Click the 'Save Changes' button at the bottom of your screen."
  How do I read the newspaper on my mobile or tablet device?: "In order to read the newspaper on your mobile or tablet device you will need to download the app from the app store. Due to the size of the main menu bar and the content in it, the newspaper cannot be viewed from a browser within your mobile or tablet device."

